name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      LUCKYPENNY_LICENSE_KEY: ${{ secrets.LUCKYPENNY_LICENSE_KEY }}
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: api/global.json
      - name: Restore
        run: dotnet restore Delivery.slnx
      - name: Build
        run: dotnet build Delivery.slnx -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/Delivery.UnitTests -c Release --no-build
      - name: Contract tests (Testcontainers PostgreSQL)
        run: dotnet test tests/Delivery.ContractTests -c Release --no-build
      - name: Pending model changes
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes -p src/Delivery.Infrastructure -s src/Delivery.Api --no-build --configuration Release
