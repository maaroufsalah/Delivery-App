# Pile locale Wimo. Postgres sur 5434 : la pile Speedy occupe déjà 5432.
#   docker compose up -d postgres        # base seule (dev, tests)
#   docker compose up -d --build         # api + web + base (recette : scripts/recette.sh)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wimo
      POSTGRES_PASSWORD: wimo
      POSTGRES_DB: wimo_delivery
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wimo -d wimo_delivery']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./api
    environment:
      ASPNETCORE_URLS: http://+:5080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=wimo_delivery;Username=wimo;Password=wimo
      WEB_ORIGIN: http://localhost:3000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret-change-me-0123456789}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-refresh-secret-change-me-0123456789}
      MIGRATE_ON_STARTUP: 'true'
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@wimo.ma}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      LUCKYPENNY_LICENSE_KEY: ${LUCKYPENNY_LICENSE_KEY:-}
      UPLOADS_DIR: /app/uploads
    ports:
      - '5080:5080'
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5080/api
        NEXT_PUBLIC_PLATFORM_DOMAIN: localhost
    environment:
      API_URL: http://api:5080/api
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
